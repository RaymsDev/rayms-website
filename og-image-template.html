<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        color: white;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
      }

      .container {
        max-width: 900px;
        padding: 40px;
      }

      .logo {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 20px;
        background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .title {
        font-size: 36px;
        font-weight: 600;
        margin-bottom: 15px;
        line-height: 1.2;
      }

      .subtitle {
        font-size: 24px;
        opacity: 0.9;
        margin-bottom: 30px;
        line-height: 1.3;
      }

      .features {
        display: flex;
        justify-content: center;
        gap: 40px;
        font-size: 18px;
        opacity: 0.8;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
      }

      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        animation: twinkle 3s infinite;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars"></div>

    <div class="container">
      <div class="logo">🧪 RAYMS LAB</div>
      <div class="title">Interactive Adventures & Expeditions</div>
      <div class="subtitle">
        Discover unique digital experiences and explore new worlds
      </div>
      <div class="features">
        <div class="feature">🎮 <span>Interactive</span></div>
        <div class="feature">🌟 <span>Adventure</span></div>
      </div>
    </div>

    <script>
      // Generate random stars
      function createStars() {
        const starsContainer = document.querySelector('.stars');
        for (let i = 0; i < 100; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.left = Math.random() * 100 + '%';
          star.style.top = Math.random() * 100 + '%';
          star.style.width = Math.random() * 3 + 1 + 'px';
          star.style.height = star.style.width;
          star.style.animationDelay = Math.random() * 3 + 's';
          starsContainer.appendChild(star);
        }
      }
      createStars();
    </script>
  </body>
</html>
