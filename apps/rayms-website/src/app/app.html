<router-outlet></router-outlet>

<!-- Hidden tap area for mobile secret access (top-left corner) -->
<div
  class="secret-tap-area"
  (click)="onSecretAreaTap($event)"
  (touchend)="onSecretAreaTap($event)"
  (keydown)="$event.key === 'Enter' && onSecretAreaTap($event)"
  tabindex="-1"
  role="button"
  aria-hidden="true"
></div>

@if(showRouteNavigator){
<div
  class="route-navigator-overlay"
  (click)="toggleRouteNavigator()"
  (keydown.escape)="toggleRouteNavigator()"
  tabindex="0"
>
  <div
    class="route-navigator"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    tabindex="0"
  >
    <div class="route-navigator-header">
      <h3>🗺️ Route Navigator</h3>
      <button class="close-btn" (click)="toggleRouteNavigator()">
        &times;
      </button>
    </div>
    <div class="route-navigator-content">
      <p class="hint">Available routes on this website:</p>
      <div class="routes-list">
        @for(route of availableRoutes; track $index){
        <button class="route-btn" (click)="navigateToRoute(route)">
          {{ route === '' ? '/ (home)' : '/' + route }}
        </button>
        }
      </div>
      <div class="shortcut-hint">
        <small>
          Desktop: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> |
          Mobile: 5 quick taps on top-left corner |
          <kbd>ESC</kbd> to close
        </small>
      </div>
    </div>
  </div>
</div>

}
